name: Pruebas

on:
  push:
    branches: [main, postgresql, estado-en-memoria]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/MesaNexo.Web/package-lock.json
      - name: Dependencias de Python
        run: python -m pip install -r requirements-lab.txt
      - name: PostgreSQL del laboratorio
        shell: pwsh
        run: ./tools/Get-Postgres.ps1
      # The repository keeps earlier evidence; without this an old file would pass for this run.
      - name: Evidencia limpia
        shell: pwsh
        run: Remove-Item evidence/*.json
      - name: Batería .NET
        shell: pwsh
        run: ./tools/Test.ps1 -Python (Get-Command python).Source
      - name: Instalador
        run: python -B tests/test_culinaryos_install.py
      - name: Actualización interrumpida
        run: python -B tests/test_update_apply.py
      - name: Métricas del panel
        run: python -B tests/test_owner_stats_vectors.py
      - name: Interfaz
        shell: pwsh
        working-directory: src/MesaNexo.Web
        run: |
          npm ci
          npx playwright install chromium
          npm run build
          dotnet build ../../tests/MesaNexo.Hybrid.Tests/MesaNexo.Hybrid.Tests.csproj -c Release -p:CulinaryRootPublicKey="$(Resolve-Path ../../tests/keys/root-public.pem)"
          npx playwright test
      - name: Informe
        if: always()
        shell: pwsh
        run: |
          python tools/evidence_report.py --strict
          Get-Content evidence/INFORME.md | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-${{ github.sha }}
          path: |
            evidence/*.json
            evidence/INFORME.md
